services:
  db:
    image: postgres:16
    container_name: docrepo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docrepo
      POSTGRES_PASSWORD: docrepo_dev_password
      POSTGRES_DB: docrepo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrepo -d docrepo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
